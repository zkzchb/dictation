<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>听写小助手 V2/V3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --wechat-green: #07C160; --wechat-light: #E9F9F0; }
        body { font-family: sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        [x-cloak] { display: none !important; }
        .pulse-ring { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(7,193,96,.7); }
            70%  { box-shadow: 0 0 0 20px rgba(7,193,96,0); }
            100% { box-shadow: 0 0 0 0 rgba(7,193,96,0); }
        }
        .btn-wechat {
            background-color: var(--wechat-green); color: white;
            font-weight: bold; border-radius: 8px; transition: all .2s;
        }
        .btn-wechat:active:not(:disabled) { background-color: #06AD56; transform: scale(.98); }
        .btn-wechat:disabled { opacity: .5; cursor: not-allowed; }
        .tianzige-wrap { display: flex; gap: .5rem; justify-content: center; margin-bottom: 2rem; }
        .tianzige-box  { display: flex; flex-direction: column; align-items: center; }
        .pinyin-top    { font-family: monospace; font-size: 1.1rem; color: #9ca3af;
                         margin-bottom: .2rem; text-align: center; height: 1.5rem; }
        .tianzige {
            position: relative; width: 4.5rem; height: 4.5rem; border: 2px solid #d1d5db;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Kaiti SC','STKaiti','KaiTi',serif; background: white;
        }
        .tianzige::before { content:''; position:absolute; top:50%; left:0;
                            width:100%; border-top:1px dashed #d1d5db; }
        .tianzige::after  { content:''; position:absolute; top:0; left:50%;
                            height:100%; border-left:1px dashed #d1d5db; }
        .tianzige-char { position:relative; z-index:10; font-size:3rem; color:#1f2937; }
    </style>
</head>
<body class="bg-gray-100 h-[100dvh] w-full flex flex-col items-center justify-center"
      x-data="dictationApp()">
<div class="w-full max-w-lg h-full bg-[#F7F7F7] flex flex-col relative shadow-2xl overflow-hidden">

  <!-- 顶栏 -->
  <header class="bg-[#F7F7F7] p-4 z-20 shrink-0 flex justify-between items-center border-b border-gray-200">
    <div class="font-bold text-lg text-slate-800 flex items-center gap-2">
      <i class="fas fa-graduation-cap text-[#07C160]"></i> 小助手V2
    </div>
    <div class="text-xs text-gray-400 font-mono" x-text="currentDate"></div>
  </header>

  <main class="flex-grow overflow-y-auto no-scrollbar relative w-full">

    <!-- Step 0: 模式选择 -->
    <div x-show="step===0" class="p-6 flex flex-col items-center justify-center min-h-full space-y-6">
      <div class="text-center mb-4">
        <h2 class="text-2xl font-bold text-gray-800">Hi, Mia! 👋</h2>
        <p class="text-gray-400 text-sm mt-2">今天想进行哪项挑战？</p>
      </div>
      <button @click="setMode('daily')" class="w-full bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-5 transition-transform active:scale-95">
        <div class="w-16 h-16 bg-[#E9F9F0] rounded-xl flex items-center justify-center text-[#07C160] text-3xl shrink-0"><i class="fas fa-book-open"></i></div>
        <div class="text-left flex-grow">
          <h3 class="text-lg font-bold text-gray-800">生字听写</h3>
          <p class="text-xs text-gray-400 mt-1">按课文复习，攻克新字词</p>
        </div>
        <div class="text-gray-300"><i class="fas fa-chevron-right"></i></div>
      </button>
      <button @click="setMode('unit')" class="w-full bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-5 transition-transform active:scale-95">
        <div class="w-16 h-16 bg-blue-50 rounded-xl flex items-center justify-center text-blue-500 text-3xl shrink-0"><i class="fas fa-layer-group"></i></div>
        <div class="text-left flex-grow">
          <h3 class="text-lg font-bold text-gray-800">单元复习</h3>
          <p class="text-xs text-gray-400 mt-1">单元大满贯，消灭错题本</p>
        </div>
        <div class="text-gray-300"><i class="fas fa-chevron-right"></i></div>
      </button>
    </div>

    <!-- Step 1: 选课 -->
    <div x-show="step===1" x-cloak class="p-6 flex flex-col items-center justify-center min-h-full space-y-8">
      <div class="w-24 h-24 bg-[#E9F9F0] rounded-3xl flex items-center justify-center text-[#07C160] text-4xl mb-2 shadow-sm">
        <i class="fas fa-book-reader"></i>
      </div>
      <div class="text-center">
        <h2 class="text-2xl font-bold text-gray-800" x-text="dictationMode==='daily'?'准备听写':'单元复习'"></h2>
        <p class="text-gray-400 text-sm mt-2">请确认今日听写范围</p>
      </div>
      <div class="w-full bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <label class="text-xs text-gray-400 font-bold uppercase tracking-wider" x-text="dictationMode==='daily'?'选择课程':'选择单元'"></label>
        <select x-model="selectedLesson" class="w-full mt-2 bg-transparent text-lg font-bold outline-none text-gray-700 appearance-none truncate">
          <template x-for="lesson in visibleLessons" :key="lesson.lesson_seq">
            <option :value="lesson.lesson_seq" x-text="lesson.label"></option>
          </template>
        </select>
      </div>
    </div>

    <!-- Step 2: 词表勾选 -->
    <div x-show="step===2" x-cloak class="p-4 pb-6">
      <!-- 配色图例：只列本次实际出现的类型，顺带说明词表构成 -->
      <div x-show="legend.length" class="flex flex-wrap gap-x-3 gap-y-1 mb-3 px-1 text-[11px] text-gray-500">
        <template x-for="item in legend" :key="item.type">
          <span class="flex items-center gap-1">
            <span class="w-2 h-2 rounded-full" :class="item.dot"></span>
            <span x-text="item.name"></span>
            <span class="font-bold" x-text="item.count"></span>
          </span>
        </template>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <template x-for="word in wordList" :key="word.kp_id">
          <div @click="word.selected=!word.selected"
               class="relative p-3 rounded-xl border-2 h-20 flex flex-col items-center justify-center transition-all active:scale-95"
               :class="getCardClass(word)">
            <div x-show="word.selected" class="absolute top-1 right-1">
              <i class="fas fa-check-circle text-sm" :class="getIconClass(word.type)"></i>
            </div>
            <span class="text-[10px] font-mono opacity-60 mb-0.5" x-text="word.pinyin"></span>
            <span class="text-lg font-bold tracking-wide" x-text="word.text"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- Step 4: 播放（播放列表驱动，选好词表即可播放，无需等待生成） -->
    <div x-show="step===4" x-cloak class="flex flex-col items-center justify-center h-full p-6">
      <!-- 不把 playerState 直接绑到 play/pause 事件上：Chrome 在每个切片
           自然播完后会紧跟一个 pause 事件（Firefox 不会），切换片段时也可能
           短暂 pause。直接绑定会让图标翻成「播放」，看着像反复启停。
           playerState 只表达用户意图，只由 togglePlay 和播放列表播完时写；
           pause 事件交给 onAudioPause 处理，它不动状态。 -->
      <audio x-ref="audioPlayer"
             preload="auto"
             playsinline
             @playing="playbackBlocked=false"
             @pause="onAudioPause()"
             @error="onAudioError()"
             @ended="onAudioEnded()"></audio>
      <div class="mb-2 text-center h-10">
        <span class="text-sm text-gray-400" x-show="!currentPlaylistWord">
          听写任务 共 <span class="text-[#07C160] font-bold" x-text="selectedCount"></span> 词
          <span x-show="polyphonic.length" class="text-gray-300">
            + <span x-text="polyphonic.length"></span> 多音字
          </span>
          · 预计 <span x-text="estMinutes"></span>
        </span>
      </div>

      <!-- 节奏设置：调参后立即生效，无需重新生成 -->
      <div class="w-full mb-3">
        <button @click="showCfgPanel = !showCfgPanel"
                class="text-xs text-gray-400 underline">
          <i class="fas fa-sliders-h"></i> 节奏设置
        </button>
        <div x-show="showCfgPanel" x-cloak
             class="mt-2 bg-white rounded-xl border p-3 text-xs text-left space-y-2">
          <div class="grid grid-cols-3 gap-2">
            <label>每组词数
              <input type="number" min="1" max="6" x-model.number="cfg.group_size"
                     class="w-full border rounded px-1 py-0.5"></label>
            <label>重复遍数
              <input type="number" min="1" max="3" x-model.number="cfg.repeat_times"
                     class="w-full border rounded px-1 py-0.5"></label>
            <label>词间隔ms
              <input type="number" min="0" max="60000" step="100" x-model.number="cfg.gap_between_words_ms"
                     class="w-full border rounded px-1 py-0.5"></label>
          </div>
          <div class="text-gray-500 pt-1">基础书写停顿 ms（写汉字 / 写拼音 / 检查）</div>
          <div class="grid grid-cols-3 gap-2">
            <template x-for="i in [0,1,2]" :key="'b'+i">
              <input type="number" min="0" max="60000" step="500" x-model.number="cfg.base_gap_ms[i]"
                     class="w-full border rounded px-1 py-0.5">
            </template>
          </div>
          <div class="text-gray-500 pt-1">每字增量 ms（同上三遍）</div>
          <div class="grid grid-cols-3 gap-2">
            <template x-for="i in [0,1,2]" :key="'p'+i">
              <input type="number" min="0" max="30000" step="100" x-model.number="cfg.per_char_gap_ms[i]"
                     class="w-full border rounded px-1 py-0.5">
            </template>
          </div>
          <div class="grid grid-cols-3 gap-2 pt-1">
            <label>停顿上限
              <input type="number" min="500" max="60000" step="1000" x-model.number="cfg.max_write_gap_ms"
                     class="w-full border rounded px-1 py-0.5"></label>
            <label>组间隔
              <input type="number" min="0" max="60000" step="500" x-model.number="cfg.gap_between_groups_ms"
                     class="w-full border rounded px-1 py-0.5"></label>
            <label>多音字间隔
              <input type="number" min="0" max="60000" step="1000" x-model.number="cfg.gap_polyphonic_ms"
                     class="w-full border rounded px-1 py-0.5"></label>
          </div>
          <div class="flex items-center justify-between pt-2">
            <span class="text-gray-500">预计总时长 <b x-text="estMinutes"></b></span>
            <span class="space-x-2">
              <button @click="saveCfgLocal()" class="px-2 py-1 bg-[#07C160] text-white rounded">记住</button>
              <button @click="resetCfg()" class="px-2 py-1 bg-gray-200 rounded">恢复默认</button>
            </span>
          </div>
          <p class="text-gray-400 pt-1">改完点播放即按新节奏；V1 需重新生成音频才生效。</p>
        </div>
      </div>

      <div class="tianzige-wrap h-28">
        <template x-if="currentPlaylistWord">
          <template x-for="(char,idx) in currentPlaylistWord.text.split('')" :key="idx">
            <div class="tianzige-box">
              <div class="pinyin-top" x-text="currentPlaylistWord.pinyin.split(' ')[idx]||''"></div>
              <div class="tianzige"><span class="tianzige-char" x-text="char"></span></div>
            </div>
          </template>
        </template>
      </div>
      <div class="relative w-40 h-40 flex items-center justify-center mb-10 mt-6">
        <div class="absolute inset-0 rounded-full bg-[#E9F9F0] transition-all"
             :class="playerState==='playing'?'pulse-ring':''"></div>
        <button @click="togglePlay()"
                class="relative z-10 w-32 h-32 rounded-full shadow-xl flex items-center justify-center transition-transform active:scale-95 border-4"
                :class="playerState==='playing'?'bg-white border-[#E9F9F0] text-[#07C160]':'bg-[#07C160] border-white text-white'">
          <i class="fas fa-3x" :class="playerState==='playing'?'fa-pause':'fa-play pl-2'"></i>
        </button>
      </div>
      <!-- 播报期间不因切片边界的短暂 pause 改变提示。只有用户自己点了暂停
           才显示暂停，或浏览器确实拦下连播时提示点一下。 -->
      <p class="font-medium"
         :class="playbackBlocked || playbackError ? 'text-[#F59E0B]' : 'text-gray-500'"
         x-text="playbackError || (playbackBlocked ? '被浏览器拦下了，点一下继续'
                 : (playerState==='playing' ? '正在朗读...'
                 : (playerState==='paused' ? '已暂停 (点击继续)'
                 : (playerState==='ended' ? '听写结束' : '点击开始'))))"></p>
    </div>

    <!-- Step 5: 核对 -->
    <div x-show="step===5" x-cloak class="p-4 pb-6">
      <div class="mb-4 text-xs text-gray-500 text-center">如有错误请点击卡片标记（默认全对）</div>
      <div class="space-y-3">
        <template x-for="word in selectedWords" :key="word.kp_id">
          <div @click="word.isCorrect=!word.isCorrect"
               class="bg-white p-4 rounded-xl border flex items-center justify-between shadow-sm transition-all active:scale-[.98]"
               :class="word.isCorrect?'border-transparent':'border-red-400 bg-red-50'">
            <div class="flex flex-col">
              <span class="text-xl font-mono text-gray-400" x-text="word.pinyin"></span>
              <span class="text-3xl font-black text-gray-800" x-text="word.text"></span>
            </div>
            <div class="text-2xl" :class="word.isCorrect?'text-[#07C160]':'text-red-500'">
              <i class="fas" :class="word.isCorrect?'fa-check-circle':'fa-times-circle'"></i>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Step 6: 成绩 -->
    <div x-show="step===6" x-cloak class="flex flex-col items-center pt-10 px-4 h-full overflow-y-auto">
      <div class="relative w-48 h-48 mb-6">
        <svg viewBox="0 0 36 36" class="w-full h-full transform -rotate-90">
          <path class="text-gray-200" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"/>
          <path :class="getScoreColorClass()" :stroke-dasharray="`${score},100`" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span class="text-5xl font-black text-gray-800" x-text="Math.round(score)"></span>
          <span class="text-xs text-gray-400 uppercase tracking-widest">Score</span>
        </div>
      </div>
      <div class="text-center mb-4">
        <h3 class="text-xl font-bold" x-text="score>=90?'太棒了！':(score>=80?'继续加油！':'需加强练习')"></h3>
      </div>
      <div class="mb-4 text-center text-sm font-medium h-5">
        <span x-show="mistakesSaved" class="text-[#07C160]"><i class="fas fa-check-circle"></i> 成绩已自动入库</span>
        <span x-show="saveFailed" class="text-red-500"><i class="fas fa-exclamation-circle"></i> 入库失败
          <button @click="calculateScore()" class="underline ml-1">重试</button></span>
      </div>
      <div x-show="wrongWordsList.length>0" class="w-full bg-white rounded-2xl p-5 border shadow-sm mb-6 text-left">
        <h4 class="text-orange-500 font-bold text-sm mb-3">
          <i class="fas fa-exclamation-triangle"></i> 发现 <span x-text="wrongWordsList.length"></span> 个错词
        </h4>
        <div class="space-y-3">
          <template x-for="word in wrongWordsList" :key="word.kp_id">
            <div class="flex items-baseline border-b border-dashed border-gray-100 pb-2 last:border-0">
              <span class="text-2xl font-bold text-gray-800 mr-3" x-text="word.text"></span>
              <span class="text-sm font-mono text-red-400" x-text="word.pinyin"></span>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- Step 7: 日历 -->
    <div x-show="step===7" x-cloak class="flex flex-col h-full p-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        <i class="fas fa-calendar-alt text-[#07C160]"></i> 学习足迹
      </h2>
      <div class="grid grid-cols-7 gap-2 mb-2 text-center text-xs text-gray-400 font-bold">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>
      <div class="grid grid-cols-7 gap-2">
        <template x-for="day in calendarDays" :key="day.fullDate">
          <div class="aspect-square rounded-lg flex flex-col items-center justify-center relative shadow-sm text-xs font-bold border-2"
               :class="[getCalColor(day.score),day.isToday?'border-[#07C160]':'border-transparent',day.isOtherMonth?'opacity-40':'']">
            <span x-text="day.date"></span>
            <div x-show="day.score!==null" class="absolute bottom-1 w-1.5 h-1.5 rounded-full bg-white opacity-80"></div>
          </div>
        </template>
      </div>
    </div>

  </main>

  <!-- 底部按钮栏 -->
  <footer class="bg-white p-4 border-t z-20 shrink-0 w-full">
    <button x-show="step===1" x-cloak @click="generateWordList()" class="btn-wechat w-full py-4 text-lg shadow-lg">生成词表</button>
    <button x-show="step===2" x-cloak @click="confirmAndPlay()" class="btn-wechat w-full py-4 text-lg shadow-lg" :disabled="selectedCount===0">
      确认听写 (<span x-text="selectedCount"></span>)
    </button>
    <button x-show="step===4" x-cloak @click="goToStep(5)" class="btn-wechat w-full py-4 text-lg shadow-lg">核对答案</button>
    <button x-show="step===5" x-cloak @click="calculateScore()" class="btn-wechat w-full py-4 text-lg shadow-lg">计算分数</button>
    <button x-show="step===6" x-cloak @click="goToStep(7)"
            class="w-full py-4 border-2 border-[#07C160] text-[#07C160] rounded-lg font-bold text-lg active:scale-95 transition-all">成长足迹</button>
    <button x-show="step===7" x-cloak @click="location.reload()"
            class="w-full py-4 border-2 border-[#07C160] text-[#07C160] rounded-lg font-bold text-lg active:scale-95 transition-all">
      <i class="fas fa-home"></i> 返回首页
    </button>
  </footer>
</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('dictationApp', () => ({
    step: 0, dictationMode: 'daily', currentDate: '',
    playerState: 'idle', score: 0, calendarDays: [],
    mistakesSaved: false, saveFailed: false,
    lessons: [], selectedLesson: null, wordList: [],
    playlist: [], playlistIndex: 0,
    currentPlaylistWord: null, _inGap: false, _switchingTrack: false,
    _silenceUrls: {},
    // 浏览器拦下了自动连播，需要用户点一下解锁。这不是"用户想暂停"，
    // 所以单独记一个标记，不去动 playerState。
    playbackBlocked: false, playbackError: '', scoreSubmissionId: '',
    API_BASE: '',
    AUDIO_REV: 'v2-freeze-20260820',

    // 多音字段落（仅播报，不判分、核对页不列出）
    polyphonic: [],

    // 播放节奏参数：默认值来自 playback_config.json，可被面板临时覆盖
    showCfgPanel: false,
    cfg: {
      group_size: 3, repeat_times: 3,
      gap_intro_ms: 2000, gap_group_head_ms: 1000,
      gap_between_words_ms: 2000, gap_between_groups_ms: 2000,
      base_gap_ms: [3000, 2000, 2500],
      per_char_gap_ms: [1500, 1000, 600],
      max_write_gap_ms: 14000,
      gap_polyphonic_ms: 8000, playback_rate: 1.0,
    },

    async loadConfig() {
      // 1) 默认值文件
      try {
        const r = await fetch('/playback_config.json');
        if (r.ok) {
          const j = await r.json();
          for (const k in this.cfg) if (k in j) this.cfg[k] = j[k];
        }
      } catch (e) { /* 用内置默认值 */ }
      // 2) 本机覆盖值优先
      try {
        const saved = localStorage.getItem('playbackCfg');
        if (saved) Object.assign(this.cfg, JSON.parse(saved));
      } catch (e) { /* 忽略损坏的本地值 */ }
      this.normalizeCfg();
    },

    clampInt(value, min, max, fallback) {
      const n = Math.round(Number(value));
      return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
    },

    normalizeCfg() {
      const c = this.cfg;
      c.group_size = this.clampInt(c.group_size, 1, 6, 3);
      c.repeat_times = this.clampInt(c.repeat_times, 1, 3, 3);
      for (const key of ['gap_intro_ms','gap_group_head_ms','gap_between_words_ms',
                         'gap_between_groups_ms','gap_polyphonic_ms']) {
        c[key] = this.clampInt(c[key], 0, 60000, 2000);
      }
      c.max_write_gap_ms = this.clampInt(c.max_write_gap_ms, 500, 60000, 14000);
      const defaults = [[3000,2000,2500], [1500,1000,600]];
      c.base_gap_ms = Array.isArray(c.base_gap_ms) ? c.base_gap_ms.slice(0,3) : [];
      c.per_char_gap_ms = Array.isArray(c.per_char_gap_ms) ? c.per_char_gap_ms.slice(0,3) : [];
      while (c.base_gap_ms.length < 3) c.base_gap_ms.push(defaults[0][c.base_gap_ms.length]);
      while (c.per_char_gap_ms.length < 3) c.per_char_gap_ms.push(defaults[1][c.per_char_gap_ms.length]);
      c.base_gap_ms = c.base_gap_ms.map((v,i) => this.clampInt(v, 0, 60000, defaults[0][i]));
      c.per_char_gap_ms = c.per_char_gap_ms.map((v,i) => this.clampInt(v, 0, 30000, defaults[1][i]));
    },

    saveCfgLocal() {
      this.normalizeCfg();
      localStorage.setItem('playbackCfg', JSON.stringify(this.cfg));
    },

    resetCfg() {
      localStorage.removeItem('playbackCfg');
      location.reload();
    },

    // 估算总时长，便于调参时即时看到影响
    get estMinutes() {
      const c = this.cfg, n = this.selectedCount || 30;
      const groupSize = this.clampInt(c.group_size, 1, 6, 3);
      const repeats = this.clampInt(c.repeat_times, 1, 3, 3);
      const groups = Math.ceil(n / groupSize);
      let ms = 2000 + c.gap_intro_ms;
      for (let g = 0; g < groups; g++) {
        ms += 1200 + c.gap_group_head_ms;
        for (let p = 0; p < repeats; p++) {
          ms += groupSize * (2 * 550 + c.gap_between_words_ms);
          ms += Math.min(c.base_gap_ms[p] + 1 * c.per_char_gap_ms[p], c.max_write_gap_ms);
        }
        ms += c.gap_between_groups_ms;
      }
      // 多音字每字三段，实测：poly_prefix 1.30s + 单字 0.97s + poly_suffix 3.20s
      ms += this.polyphonic.length * (5470 + c.gap_polyphonic_ms);
      const s = Math.round(ms / 1000);
      return `${Math.floor(s / 60)}分${String(s % 60).padStart(2, '0')}秒`;
    },

    get selectedWords()  { return this.wordList.filter(w => w.selected); },
    get selectedCount()  { return this.selectedWords.length; },
    get wrongWordsList() { return this.selectedWords.filter(w => !w.isCorrect); },

    async init() {
      const now = new Date();
      const wd  = ['日','一','二','三','四','五','六'];
      this.currentDate = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${wd[now.getDay()]}`;
      await this.loadConfig();
      this.generateCalendar();
      try {
        const res = await fetch(`${this.API_BASE}/api/lessons`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        this.lessons = await res.json();
        this.syncSelectedLesson();   // 课程可能在 setMode 之后才到，补一次校正
      } catch(e) { console.error('课程加载失败', e); }
    },

    // 两种模式的课程互不相同：生字听写只列正式课，单元复习只列复习课。
    // 后端已给出 is_review，前端不必再猜 lesson_seq 的编码规则。
    get visibleLessons() {
      const wantReview = this.dictationMode === 'unit';
      return this.lessons.filter(l => !!l.is_review === wantReview);
    },

    // 切模式后下拉菜单的选项整批换了，selectedLesson 可能还指着上一模式的课。
    // 不校正的话会用正式课的 lesson_seq 配 mode=unit 去请求，出题梯队全错。
    syncSelectedLesson() {
      const list = this.visibleLessons;
      if (!list.length) { this.selectedLesson = null; return; }
      if (!list.some(l => l.lesson_seq === this.selectedLesson)) {
        this.selectedLesson = list[0].lesson_seq;
      }
    },

    setMode(mode) {
      this.dictationMode = mode;
      this.syncSelectedLesson();
      this.step = 1;
    },

    async generateWordList() {
      this.step = 2;
      try {
        const res  = await fetch(`${this.API_BASE}/api/generate_daily/${this.selectedLesson}?mode=${this.dictationMode}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}：${(await res.text()).slice(0,160)}`);
        const data = await res.json();
        // 按梯队显示顺序重排（稳定排序保留同级内后端原有间距）：
        // 生字听写：上次错词 → 本课生字组词 → 本课词语表 → 其余（近期错词/复习/凑数）
        // 单元复习：后端已按梯队给序，维持原序（wrong_last 在前即可）
        const TIER = { wrong_last: 0, new_char: 1, new_word: 2 };
        const tier = t => TIER[t] ?? 3;
        const words = data.data.map(item => ({
          kp_id: item.id, text: item.target, pinyin: item.pinyin || '',
          type: item.word_type || 'review', audio_url: item.audio_url || '',
          selected: true, isCorrect: true,
        }));
        if (this.dictationMode === 'daily') {
          words.sort((a, b) => tier(a.type) - tier(b.type));
        }
        this.wordList = words;
        this.polyphonic = data.polyphonic_section || [];
        this.scoreSubmissionId = '';
      } catch(e) { console.error('获取词表失败', e); }
    },

    confirmAndPlay() {
      if (!this.selectedCount) return;
      this.normalizeCfg();
      this.playlist        = this.buildPlaylist();
      this.playlistIndex   = 0;
      this.currentPlaylistWord = null;
      this.playerState     = 'idle';
      this._inGap          = false;
      this._switchingTrack = false;
      this.playbackBlocked = false;
      this.playbackError   = '';
      this.goToStep(4);
    },

    // 书写停顿按字数缩放：min(base + (字数-1)*perChar, max)
    writeGap(passIdx, text) {
      const c = this.cfg;
      const chars = (text || '').length || 1;
      const base = c.base_gap_ms[passIdx] ?? 5000;
      const per  = c.per_char_gap_ms[passIdx] ?? 0;
      return Math.min(base + (chars - 1) * per, c.max_write_gap_ms);
    },

    buildPlaylist() {
      const c = this.cfg, items = [], words = this.selectedWords;
      const gs = c.group_size, rt = c.repeat_times;

      items.push({ url: '/audio/sys/intro.mp3', word: null, gapMs: c.gap_intro_ms });

      for (let i = 0; i < words.length; i += gs) {
        const group = words.slice(i, i + gs);
        const gNum  = Math.floor(i / gs) + 1;
        items.push({ url: `/audio/sys/g${gNum}.mp3`, word: null, gapMs: c.gap_group_head_ms });

        for (let pass = 0; pass < rt; pass++) {
          group.forEach((w, k) => {
            // 组内词间用固定小间隔；每组最后一个词后给"书写停顿"（按字数缩放）
            const isLast = (k === group.length - 1);
            const longest = group.reduce((a, x) =>
              Math.max(a, (x.text || '').length), 1);
            const gapMs = isLast
              ? this.writeGap(pass, 'x'.repeat(longest))
              : c.gap_between_words_ms;
            items.push({ url: w.audio_url || null, word: w, gapMs });
          });
        }
        items.push({ url: null, word: null, gapMs: c.gap_between_groups_ms });
      }

      // 多音字：仅语音播报 + 长间隔，不判分、核对页不列出。
      // 每字三段拼接 —— 「多音字：」+ 老师录的单字 + 「，请组词并默写，标注拼音。」
      // 前两段之间不留间隔（gapMs: 0），听感才连贯；只在末段后留书写时间。
      // 老师录的是本课那一个读音，所以题目只针对这个音组词。
      for (const p of this.polyphonic) {
        items.push({ url: '/audio/sys/poly_prefix.mp3', word: null, gapMs: 0 });
        items.push({
          url: p.audio_url || null,
          word: { text: p.character, pinyin: p.pron || '', polyphonic: true },
          gapMs: 0,
        });
        items.push({ url: '/audio/sys/poly_suffix.mp3', word: null, gapMs: c.gap_polyphonic_ms });
      }

      items.push({ url: '/audio/sys/outro.mp3', word: null, gapMs: 0 });
      return items;
    },

    // 手机浏览器只允许由一次用户手势启动的媒体会话连续播放。过去用
    // setTimeout 实现词间停顿，计时器结束后的下一次 audio.play() 已经脱离
    // 用户手势，部分浏览器会把它当成新的自动播放并拦截。
    //
    // 现在把停顿也做成真正的静音 WAV，并始终交给同一个 <audio> 元素播放。
    // 音频片段和静音片段在 ended 事件里直接衔接，整场听写因此只需要首次点击。
    getSilenceUrl(durationMs) {
      const ms = Math.min(60000, Math.max(20, Math.round(Number(durationMs) || 0)));
      if (this._silenceUrls[ms]) return this._silenceUrls[ms];

      const sampleRate = 8000;
      const sampleCount = Math.ceil(sampleRate * ms / 1000);
      const buffer = new ArrayBuffer(44 + sampleCount);
      const view = new DataView(buffer);
      const writeText = (offset, value) => {
        for (let i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i));
      };
      writeText(0, 'RIFF');
      view.setUint32(4, 36 + sampleCount, true);
      writeText(8, 'WAVE');
      writeText(12, 'fmt ');
      view.setUint32(16, 16, true);       // PCM fmt chunk size
      view.setUint16(20, 1, true);        // PCM
      view.setUint16(22, 1, true);        // mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate, true); // 8-bit mono byte rate
      view.setUint16(32, 1, true);
      view.setUint16(34, 8, true);
      writeText(36, 'data');
      view.setUint32(40, sampleCount, true);
      new Uint8Array(buffer, 44).fill(128); // unsigned 8-bit PCM silence

      const url = URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
      this._silenceUrls[ms] = url;
      return url;
    },

    versionedAudioUrl(url) {
      if (!url || url.startsWith('blob:') || url.startsWith('data:')) return url;
      const sep = url.includes('?') ? '&' : '?';
      return `${url}${sep}rev=${this.AUDIO_REV}`;
    },

    async playTrack(url) {
      const audio = this.$refs.audioPlayer;
      this._switchingTrack = true;
      this.playbackError = '';
      audio.src = this.versionedAudioUrl(url);
      try {
        await audio.play();
        this.playbackBlocked = false;
      } catch(e) {
        // 保留当前 src 和播放列表位置；用户再次点击时从这一段继续。
        this.playbackBlocked = true;
      } finally {
        this._switchingTrack = false;
      }
    },

    playGap(durationMs) {
      if (!(durationMs > 0)) {
        this.playlistIndex++;
        this.playNextItem();
        return;
      }
      this._inGap = true;
      this.playTrack(this.getSilenceUrl(durationMs));
    },

    async playNextItem() {
      if (this.playlistIndex >= this.playlist.length) {
        this.playerState = 'ended';
        this.currentPlaylistWord = null;
        this._inGap = false;
        return;
      }
      const item = this.playlist[this.playlistIndex];
      this.currentPlaylistWord = item.word || null;
      if (!item.url) {
        // 纯间隔（无音频文件，如组间停顿）也作为静音音轨播放，避免
        // setTimeout 后重新 play() 被手机浏览器视为自动播放。
        this.playGap(item.gapMs);
        return;
      }
      this._inGap = false;
      await this.playTrack(item.url);
    },

    // playerState 只由人的意图决定，pause 事件一概不写它。
    //
    // 原先这里用 _ignorePause 挡"非用户发起"的 pause，但那是个一次性布尔，
    // 而一次切片切换会发出多个 pause：换 src 触发一个，Chrome 在 ended 之后
    // 还补一个，中间新切片的 playing 事件又把标记清掉。标记只挡得住第一个，
    // 漏下来的那个就在词间停顿里把状态翻成 'paused'，屏幕上闪出
    // 「已暂停 (点击继续)」——听写其实还在正常往下走。多音字三段拼接
    // （gapMs 为 0，切换最密）最容易看到。
    //
    // 挡不干净的原因是拿一次性标记去数不确定数量的事件，所以不再去数：
    // 播报期间音频元素本来就会反复 pause（切片边界、换 src），这是
    // 正常状态，不该让它反映到 UI。真正的暂停只有一个来源 —— 用户点按钮，
    // 那条路径在 togglePlay 里已显式设好状态。
    //
    // 代价是外部打断（来电、耳机键）不再自动显示为暂停。改为先尝试续播：
    // 能续上就当没发生过，续不上才置 playbackBlocked 提示需要点一下。
    onAudioPause() {
      if (this.playerState !== 'playing') return;   // 用户已暂停/未开始，无需干预
      if (this._switchingTrack) return;              // 正在切换音频/静音片段
      const audio = this.$refs.audioPlayer;
      // ended 之后的那个 pause 不能续播 —— 一续就把刚播完的切片从头再放一遍。
      // 推进播放列表的活儿归 onAudioEnded，这里只管"播到一半被掐断"的情况。
      if (!audio || audio.ended || !audio.src) return;
      audio.play().catch(() => { this.playbackBlocked = true; });
    },

    onAudioEnded() {
      const item = this.playlist[this.playlistIndex];
      if (!item) return;
      if (this._inGap) {
        // 当前结束的是该播放项后面的静音片段；现在才推进到下一项。
        this._inGap = false;
        this.playlistIndex++;
        this.playNextItem();
        return;
      }
      if (item.gapMs > 0) {
        // 保持当前词显示（孩子正在写），静音片段结束后再推进。
        this.playGap(item.gapMs);
      } else {
        this.playlistIndex++;
        this.playNextItem();
      }
    },

    onAudioError() {
      const audio = this.$refs.audioPlayer;
      if (!audio || !audio.src || this._switchingTrack) return;
      this.playerState = 'paused';
      this.playbackBlocked = false;
      this.playbackError = '音频加载失败，请检查网络后点一下重试';
    },

    togglePlay() {
      const audio = this.$refs.audioPlayer;
      if (this.playerState === 'playing') {
        // 连播被拦时按钮仍是「暂停」态，但此刻并没有在响。这一下点击带来了
        // 用户手势，正好用来解锁，而不该被当成"想暂停"。
        if (this.playbackBlocked) {
          this.playbackBlocked = false;
          audio.play().catch(() => { this.playbackBlocked = true; });
          return;
        }
        this.playerState = 'paused';       // 用户意图，显式设置
        audio.pause();
      } else if (this.playerState === 'paused') {
        this.playerState = 'playing';
        this.playbackBlocked = false;
        this.playbackError = '';
        // 音频或静音停顿都从原位置继续，不再跳过剩余停顿。
        audio.play().catch(() => { this.playbackBlocked = true; });
      } else {
        // idle 或 ended：从头开始
        this.playlistIndex = 0; this.currentPlaylistWord = null;
        this.playbackBlocked = false;
        this.playbackError = '';
        this.playerState = 'playing'; this.playNextItem();
      }
    },

    async calculateScore() {
      const results = this.selectedWords.map(w => ({ kp_id: w.kp_id, is_correct: w.isCorrect }));
      const total = results.length, correct = results.filter(r => r.is_correct).length;
      this.score = total ? (correct / total) * 100 : 0;
      this.mistakesSaved = false; this.saveFailed = false;
      this.goToStep(6);
      if (!this.scoreSubmissionId) {
        this.scoreSubmissionId = (globalThis.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : `s_${Date.now()}_${Math.random().toString(36).slice(2,12)}`;
      }
      try {
        const res = await fetch(`${this.API_BASE}/api/submit_dictation`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          // poly_ids：本轮播报过的多音字。它们不判分、不入错题库，
          // 但要记下来供「连续两次出现则休息一轮」的规则读取。
          body: JSON.stringify({ user_id: 1, dictation_type: this.dictationMode,
                                 scope_id: this.selectedLesson, results,
                                 poly_ids: this.polyphonic.map(p => p.id),
                                 submission_id: this.scoreSubmissionId }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}：${(await res.text()).slice(0,160)}`);
        const data = await res.json();
        this.score = data.score; this.mistakesSaved = true;
      } catch(e) { console.error('入库失败', e); this.saveFailed = true; }
    },

    goToStep(s) {
      if (this.step === 4) {
        // 先落状态再 pause：onAudioPause 只在 playerState 为 'playing' 时才
        // 尝试续播，顺序颠倒会让它把我们正要停掉的音频又续上。
        this.playerState = 'paused';
        this.playbackBlocked = false;
        this.playbackError = '';
        this._inGap = false;
        this._switchingTrack = false;
        const audio = this.$refs.audioPlayer;
        if (audio) { audio.pause(); audio.src = ''; }
      }
      this.step = s;
      const m = document.querySelector('main');
      if (m) m.scrollTop = 0;
    },

    generateCalendar() {
      const days = [], today = new Date(); today.setHours(0, 0, 0, 0);
      const start = new Date(today);
      start.setDate(today.getDate() - today.getDay() - 14);
      for (let i = 0; i < 35; i++) {
        const d = new Date(start); d.setDate(start.getDate() + i);
        const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        days.push({ date: d.getDate(), fullDate: ds,
          isToday: d.getTime() === today.getTime(),
          isOtherMonth: d.getMonth() !== today.getMonth(), score: null });
      }
      this.calendarDays = days; this.fetchHistoryData();
    },

    async fetchHistoryData() {
      try {
        const s = this.calendarDays[0].fullDate, e = this.calendarDays[34].fullDate;
        const res = await fetch(`${this.API_BASE}/api/dictation_history?start_date=${s}&end_date=${e}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const map = await res.json();
        this.calendarDays.forEach(d => { if (map[d.fullDate] !== undefined) d.score = map[d.fullDate]; });
      } catch(e) { /* 未连接后端时静默忽略 */ }
    },

    // ── 六色体系 ───────────────────────────────────────────────────────
    // 暖色警示（错词）／冷色新知（本课）／灰色复习（回溯凑数）。
    // 红色只留给「上次刚错」，稀缺才有警示力；review 占位最多，必须视觉降权。
    WORD_STYLES: {
      wrong_last:   { card: 'bg-red-50 border-red-400 text-red-700',
                      dot:  'text-red-500',    name: '上次错词' },
      wrong_recent: { card: 'bg-orange-50 border-orange-300 text-orange-700',
                      dot:  'text-orange-500', name: '近期错词' },
      new_char:     { card: 'bg-blue-50 border-blue-300 text-blue-800',
                      dot:  'text-blue-500',   name: '本课生字' },
      new_word:     { card: 'bg-[#E9F9F0] border-[#07C160]/40 text-[#07C160]',
                      dot:  'text-[#07C160]',  name: '本课词语' },
      filler:       { card: 'bg-purple-50 border-purple-200 text-purple-700',
                      dot:  'text-purple-500', name: '易混字' },
      review:       { card: 'bg-slate-50 border-slate-200 text-slate-500',
                      dot:  'text-slate-400',  name: '复习' },
    },

    getCardClass(word) {
      if (!word.selected) return 'bg-gray-50 opacity-50 grayscale border-transparent text-gray-400';
      const s = this.WORD_STYLES[word.type];
      return s ? s.card : 'bg-white border-gray-200';
    },
    getIconClass(type) {
      const s = this.WORD_STYLES[type];
      return s ? s.dot : 'text-gray-400';
    },

    // 图例：只列出本次词表里真正出现的类型，顺带显示各类数量
    get legend() {
      const n = {};
      for (const w of this.wordList) n[w.type] = (n[w.type] || 0) + 1;
      return Object.keys(this.WORD_STYLES)
        .filter(t => n[t])
        .map(t => ({ type: t, name: this.WORD_STYLES[t].name,
                     dot: this.WORD_STYLES[t].dot, count: n[t] }));
    },
    getScoreColorClass() {
      return this.score >= 90 ? 'text-[#07C160]' : this.score >= 80 ? 'text-[#91ED61]' : 'text-[#EE5E5E]';
    },
    getCalColor(s) {
      if (s === null) return 'bg-white text-gray-300 border border-gray-100';
      return s >= 90 ? 'bg-[#07C160] text-white border-[#07C160]'
           : s >= 80 ? 'bg-[#91ED61] text-white border-[#91ED61]'
                     : 'bg-[#EE5E5E] text-white border-[#EE5E5E]';
    },
  }))
})
</script>
</body>
</html>
