name: Release

on:
  push:
    tags: ["v2.1.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DICTATION_CONTENT_ROOT: tests/fixtures/demo-content-pack
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/requirements.txt
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r v2/requirements.txt
          python -m pip install pip-audit==2.10.1
      - name: Validate release tree
        run: |
          test "v${GITHUB_REF_NAME#v}" = "$GITHUB_REF_NAME"
          python -m pip check
          python -m compileall -q v2 v3 shared tools tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tests/check_inline_js.py
          for script in deploy/*.sh; do bash -n "$script"; done
          test ! -d chinese
          test ! -d v1
      - name: Build source archive, SBOM and checksums
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="dictation-${GITHUB_REF_NAME}/" \
            --output="dist/dictation-${GITHUB_REF_NAME}.tar.gz" \
            "$GITHUB_REF_NAME"
          python -m pip_audit -r v2/requirements.txt \
            --format cyclonedx-json \
            --output "dist/dictation-${GITHUB_REF_NAME}.cdx.json"
          (
            cd dist
            sha256sum \
              "dictation-${GITHUB_REF_NAME}.tar.gz" \
              "dictation-${GITHUB_REF_NAME}.cdx.json" \
              > "SHA256SUMS"
            sha256sum --check "SHA256SUMS"
          )
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Dictation $GITHUB_REF_NAME" \
            --notes "Compatible content: [content-v1.0.0](https://github.com/zkzchb/dictation-content/releases/tag/content-v1.0.0)." \
            "${release_flags[@]}" \
            --generate-notes
