name: V2 freeze checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install runtime dependencies
        run: pip install -r v2/requirements.txt
      - name: Compile Python
        run: python -m compileall -q v2 shared tests
      - name: Run V2 regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit frozen dependencies
        run: pip install pip-audit==2.10.1 && pip-audit -r v2/requirements.txt
      - name: Parse browser scripts
        run: python tests/check_inline_js.py
      - name: Parse deployment scripts
        run: bash -n deploy/*.sh
