name: Publish V2 stable release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[release v2.0.0]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/v2.0.0-notes.md"
          {
            printf '# Dictation V2.0.0\n\n'
            printf 'V2 功能冻结版。标准源码分支不携带 Python wheelhouse。\n\n'
            printf -- '- 43 门课程、814 个知识点。\n'
            printf -- '- 869 个词条音频和 25 个系统提示音。\n'
            printf -- '- 支持 IP-only HTTP、域名 HTTPS 或两者并行。\n'
            printf -- '- 使用 `deploy/install-v2-online.sh` 交互式部署。\n'
            printf -- '- 离线部署请使用 `main-offline` 分支及对应离线发行版。\n'
          } > "$notes"
          gh release create v2.0.0 \
            --target "$GITHUB_SHA" \
            --title "Dictation V2.0.0" \
            --notes-file "$notes"

