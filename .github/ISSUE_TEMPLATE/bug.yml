name: Bug report
description: Report a reproducible V2/V3 program defect.
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: target
    attributes:
      label: Target
      options: [V2 local, V2 VPS, V3 Cloudflare]
    validations:
      required: true
  - type: input
    id: program_ref
    attributes:
      label: Program version or commit
    validations:
      required: true
  - type: input
    id: content_identity
    attributes:
      label: Pack id, content version, and dataset digest
      description: Copy these from deployment.json; do not include private paths or credentials.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, domains, IPs, usernames, learning records, and recording data.
      render: shell
  - type: checkboxes
    id: hygiene
    attributes:
      label: Data hygiene
      options:
        - label: I removed credentials, personal infrastructure, learning data, and private recordings.
          required: true
