<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>听写小助手 Mia专用版 V1.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --wechat-green: #07C160;
            --wechat-light: #E9F9F0;
        }
        body { font-family: sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        [x-cloak] { display: none !important; }
        
        .pulse-ring { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(7, 193, 96, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(7, 193, 96, 0); }
            100% { box-shadow: 0 0 0 0 rgba(7, 193, 96, 0); }
        }

        .btn-wechat {
            background-color: var(--wechat-green);
            color: white;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-wechat:active:not(:disabled) {
            background-color: #06AD56;
            transform: scale(0.98);
        }
        .btn-wechat:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 极客田字格 CSS */
        .tianzige-wrap { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 2rem; }
        .tianzige-box { display: flex; flex-direction: column; items-center; }
        .pinyin-top { font-family: monospace; font-size: 1.1rem; color: #9ca3af; margin-bottom: 0.2rem; text-align: center; height: 1.5rem; }
        .tianzige {
            position: relative; width: 4.5rem; height: 4.5rem; border: 2px solid #d1d5db;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', serif; background: white;
        }
        .tianzige::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; border-top: 1px dashed #d1d5db; }
        .tianzige::after { content: ''; position: absolute; top: 0; left: 50%; height: 100%; border-left: 1px dashed #d1d5db; }
        .tianzige-char { position: relative; z-index: 10; font-size: 3rem; color: #1f2937; }
    </style>
</head>

<body class="bg-gray-100 h-[100dvh] w-full flex flex-col items-center justify-center" x-data="dictationApp()">
    <div class="w-full max-w-lg h-full bg-[#F7F7F7] flex flex-col relative shadow-2xl overflow-hidden">

        <header class="bg-[#F7F7F7] p-4 z-20 shrink-0 flex justify-between items-center border-b border-gray-200">
            <div class="font-bold text-lg text-slate-800 flex items-center gap-2">
                <i class="fas fa-graduation-cap text-[#07C160]"></i> 小助手V1.0
            </div>
            <div class="text-xs text-gray-400 font-mono" x-text="currentDate"></div>
        </header>

        <main class="flex-grow overflow-y-auto no-scrollbar relative w-full">
            
            <div x-show="step === 0" class="p-6 flex flex-col items-center justify-center min-h-full space-y-6">
                <div class="text-center mb-4">
                    <h2 class="text-2xl font-bold text-gray-800">Hi, Mia! 👋</h2>
                    <p class="text-gray-400 text-sm mt-2">今天想进行哪项挑战？</p>
                </div>
                <button @click="setMode('daily')" class="w-full bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-5 transition-transform active:scale-95">
                    <div class="w-16 h-16 bg-[#E9F9F0] rounded-xl flex items-center justify-center text-[#07C160] text-3xl shrink-0"><i class="fas fa-book-open"></i></div>
                    <div class="text-left flex-grow">
                        <h3 class="text-lg font-bold text-gray-800">生字听写</h3>
                        <p class="text-xs text-gray-400 mt-1">按课文复习，攻克新字词</p>
                    </div>
                    <div class="text-gray-300"><i class="fas fa-chevron-right"></i></div>
                </button>
                <button @click="setMode('unit')" class="w-full bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-5 transition-transform active:scale-95">
                    <div class="w-16 h-16 bg-blue-50 rounded-xl flex items-center justify-center text-blue-500 text-3xl shrink-0"><i class="fas fa-layer-group"></i></div>
                    <div class="text-left flex-grow">
                        <h3 class="text-lg font-bold text-gray-800">单元复习</h3>
                        <p class="text-xs text-gray-400 mt-1">单元大满贯，消灭错题本</p>
                    </div>
                    <div class="text-gray-300"><i class="fas fa-chevron-right"></i></div>
                </button>
            </div>

            <div x-show="step === 1" x-cloak class="p-6 flex flex-col items-center justify-center min-h-full space-y-8">
                <div class="w-24 h-24 bg-[#E9F9F0] rounded-3xl flex items-center justify-center text-[#07C160] text-4xl mb-2 shadow-sm">
                    <i class="fas fa-book-reader"></i>
                </div>
                <div class="text-center">
                    <h2 class="text-2xl font-bold text-gray-800" x-text="dictationMode === 'daily' ? '准备听写' : '单元复习'"></h2>
                    <p class="text-gray-400 text-sm mt-2">请确认今日听写范围</p>
                </div>
                <div class="w-full bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <label class="text-xs text-gray-400 font-bold uppercase tracking-wider" x-text="dictationMode === 'daily' ? '选择课程' : '选择单元'"></label>
                    <select x-model="selectedLesson" class="w-full mt-2 bg-transparent text-lg font-bold outline-none text-gray-700 appearance-none truncate">
                        <template x-for="lesson in visibleLessons" :key="lesson.lesson_seq">
                            <option :value="lesson.lesson_seq" x-text="lesson.label"></option>
                        </template>
                    </select>
                </div>
            </div>

            <div x-show="step === 2" x-cloak class="p-4 pb-6">
                <div x-show="legend.length" class="flex flex-wrap gap-x-3 gap-y-1 mb-3 px-1 text-[11px] text-gray-500">
                    <template x-for="it in legend" :key="it.key">
                        <span class="inline-flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full" :class="it.dot"></span>
                            <span x-text="it.name"></span>
                            <span class="font-mono text-gray-400" x-text="it.count"></span>
                        </span>
                    </template>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <template x-for="word in wordList" :key="word.kp_id">
                        <div @click="word.selected = !word.selected"
                             class="relative p-3 rounded-xl border-2 h-20 flex flex-col items-center justify-center transition-all active:scale-95"
                             :class="getCardClass(word)">
                            <div x-show="word.selected" class="absolute top-1 right-1">
                                <i class="fas fa-check-circle text-sm" :class="getIconClass(word.type)"></i>
                            </div>
                            <span class="text-[10px] font-mono opacity-60 mb-0.5" x-text="word.pinyin"></span>
                            <span class="text-lg font-bold tracking-wide" x-text="word.text"></span>
                        </div>
                    </template>
                </div>
            </div>

            <div x-show="step === 3" x-cloak class="flex flex-col items-center justify-center h-full p-8">
                <div class="relative w-24 h-24 mb-8">
                    <svg class="animate-spin w-full h-full text-[#07C160]" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center text-sm font-bold text-[#07C160]" x-text="loadingProgress + '%'"></div>
                </div>
                <h3 class="text-lg font-bold text-gray-700 mb-2">正在生成语音</h3>
                <p class="text-xs text-gray-400 mb-6">连接AI老师中，请准备好纸笔...</p>
                <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
                    <div class="bg-[#07C160] h-2 rounded-full transition-all ease-out duration-300" :style="`width: ${loadingProgress}%`"></div>
                </div>
            </div>

            <div x-show="step === 4" x-cloak class="flex flex-col items-center justify-center h-full p-6">
                <audio x-ref="audioPlayer" :src="audioUrl" 
                       @play="playerState = 'playing'" 
                       @pause="playerState = 'paused'" 
                       @ended="playerState = 'ended'"
                       @timeupdate="syncTimeline"></audio>

                <div class="mb-6 text-center h-10">
                    <span class="text-sm text-gray-400" x-show="!currentTimelineWord">听写任务 共 <span class="text-[#07C160] font-bold" x-text="selectedCount"></span> 词</span>
                </div>

                <div class="tianzige-wrap h-28">
                    <template x-if="currentTimelineWord">
                        <template x-for="(char, index) in currentTimelineWord.text.split('')" :key="index">
                            <div class="tianzige-box">
                                <div class="pinyin-top" x-text="currentTimelineWord.pinyin.split(' ')[index] || ''"></div>
                                <div class="tianzige"><span class="tianzige-char" x-text="char"></span></div>
                            </div>
                        </template>
                    </template>
                </div>

                <div class="relative w-40 h-40 flex items-center justify-center mb-10 mt-6">
                    <div class="absolute inset-0 rounded-full bg-[#E9F9F0] transition-all" :class="playerState==='playing' ? 'pulse-ring' : ''"></div>
                    <button @click="toggleRealPlay()" 
                            class="relative z-10 w-32 h-32 rounded-full shadow-xl flex items-center justify-center transition-transform active:scale-95 border-4"
                            :class="playerState==='playing' ? 'bg-white border-[#E9F9F0] text-[#07C160]' : 'bg-[#07C160] border-white text-white'">
                        <i class="fas fa-3x" :class="playerState==='playing' ? 'fa-pause' : 'fa-play pl-2'"></i>
                    </button>
                </div>
                <p class="text-gray-500 font-medium" x-text="playerState==='playing' ? '正在朗读...' : (playerState==='paused' ? '已暂停 (点击继续)' : '点击开始')"></p>
            </div>

            <div x-show="step === 5" x-cloak class="p-4 pb-6">
                <div class="mb-4 text-xs text-gray-500 text-center">如有错误请点击卡片标记（默认全对）</div>
                <div class="space-y-3">
                    <template x-for="word in selectedWords" :key="word.kp_id">
                        <div @click="word.isCorrect = !word.isCorrect" 
                             class="bg-white p-4 rounded-xl border flex items-center justify-between shadow-sm transition-all active:scale-[0.98]"
                             :class="word.isCorrect ? 'border-transparent' : 'border-red-400 bg-red-50'">
                            <div class="flex flex-col">
                                <span class="text-xl font-mono text-gray-400" x-text="word.pinyin"></span>
                                <span class="text-3xl font-black text-gray-800" x-text="word.text"></span>
                            </div>
                            <div class="text-2xl" :class="word.isCorrect ? 'text-[#07C160]' : 'text-red-500'">
                                <i class="fas" :class="word.isCorrect ? 'fa-check-circle' : 'fa-times-circle'"></i>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div x-show="step === 6" x-cloak class="flex flex-col items-center pt-10 px-4 h-full overflow-y-auto">
                <div class="relative w-48 h-48 mb-6">
                    <svg viewBox="0 0 36 36" class="w-full h-full transform -rotate-90">
                        <path class="text-gray-200" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"/>
                        <path :class="getScoreColorClass()" :stroke-dasharray="`${score}, 100`" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span class="text-5xl font-black text-gray-800" x-text="Math.round(score)"></span>
                        <span class="text-xs text-gray-400 uppercase tracking-widest">Score</span>
                    </div>
                </div>

                <div class="text-center mb-6">
                    <h3 class="text-xl font-bold" x-text="score >= 90 ? '太棒了！' : (score >= 80 ? '继续加油！' : '需加强练习')"></h3>
                </div>

                <div class="w-full mb-4 text-center text-sm font-medium h-5">
                    <span x-show="mistakesSaved" class="text-[#07C160]"><i class="fas fa-check-circle"></i> 成绩与错题已自动入库</span>
                    <span x-show="saveFailed" class="text-red-500">
                        <i class="fas fa-exclamation-circle"></i> 入库失败
                        <button @click="calculateScore()" class="underline ml-1">点此重试</button>
                    </span>
                </div>

                <div x-show="wrongWordsList.length > 0" class="w-full bg-white rounded-2xl p-5 border shadow-sm mb-6 text-left">
                    <h4 class="text-orange-500 font-bold text-sm mb-4"><i class="fas fa-exclamation-triangle"></i> 发现 <span x-text="wrongWordsList.length"></span> 个错词，请督促订正</h4>
                    <div class="space-y-4">
                        <template x-for="word in wrongWordsList" :key="word.kp_id">
                            <div class="flex items-baseline border-b border-dashed border-gray-100 pb-2 last:border-0">
                                <span class="text-2xl font-bold text-gray-800 mr-3" x-text="word.text"></span>
                                <span class="text-sm font-mono text-red-400" x-text="word.pinyin"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <div x-show="step === 7" x-cloak class="flex flex-col h-full p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                    <i class="fas fa-calendar-alt text-[#07C160]"></i> 学习足迹
                </h2>
                <div class="grid grid-cols-7 gap-2 mb-8 text-center text-xs text-gray-400 font-bold">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div class="grid grid-cols-7 gap-2 mb-8">
                    <template x-for="day in calendarDays" :key="day.fullDate">
                        <div class="aspect-square rounded-lg flex flex-col items-center justify-center relative shadow-sm text-xs font-bold transition-all border-2"
                             :class="[
                                getCalColor(day.score),
                                day.isToday ? 'border-[#07C160]' : 'border-transparent',
                                day.isOtherMonth ? 'opacity-40' : 'opacity-100'
                             ]">
                            <span x-text="day.date"></span>
                            <div x-show="day.score !== null" class="absolute bottom-1 w-1.5 h-1.5 rounded-full bg-white opacity-80"></div>
                        </div>
                    </template>
                </div>
            </div>
        </main>

        <footer class="bg-white p-4 border-t z-20 shrink-0 w-full max-w-lg mx-auto safe-area-bottom">
            <button x-show="step === 1" x-cloak @click="generateWordList()" class="btn-wechat w-full py-4 text-lg shadow-lg">
                生成词表
            </button>
            <button x-show="step === 2" x-cloak @click="startAudioGeneration()" class="btn-wechat w-full py-4 text-lg shadow-lg" :disabled="selectedCount === 0">
                确认听写 (<span x-text="selectedCount"></span>)
            </button>
            <button x-show="step === 4" x-cloak @click="goToStep(5)" class="btn-wechat w-full py-4 text-lg shadow-lg">
                核对答案
            </button>
            <button x-show="step === 5" x-cloak @click="calculateScore()" class="btn-wechat w-full py-4 text-lg shadow-lg">
                计算分数
            </button>
            <button x-show="step === 6" x-cloak @click="goToStep(7)" class="w-full py-4 border-2 border-[#07C160] text-[#07C160] rounded-lg font-bold text-lg hover:bg-green-50 active:scale-95 transition-all">
                成长足迹
            </button>
            <button x-show="step === 7" x-cloak @click="location.reload()" class="w-full py-4 border-2 border-[#07C160] text-[#07C160] rounded-lg font-bold text-lg hover:bg-green-50 active:scale-95 transition-all">
                <i class="fas fa-home"></i> 返回首页
            </button>
        </footer>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('dictationApp', () => ({
                step: 0,
                dictationMode: 'daily',
                currentDate: '',
                loadingProgress: 0,
                playerState: 'idle', 
                score: 0,
                calendarDays: [],
                mistakesSaved: false,
                saveFailed: false,

                lessons: [],
                selectedLesson: null,
                wordList: [],
                audioUrl: null,
                timeline: [],
                currentTimelineWord: null,

                // 本地测试请修改此地址，正式部署留空即可
                API_BASE: '',

                // 图例：只列本次实际出现的类型，顺便说明本次词表构成
                get legend() {
                    const meta = {
                        wrong_last:   ['上次错词', 'bg-red-400'],
                        wrong_recent: ['近期错词', 'bg-orange-400'],
                        new_char:     ['本课生字', 'bg-blue-400'],
                        new_word:     ['本课词语', 'bg-[#07C160]'],
                        filler:       ['易混补充', 'bg-purple-400'],
                        review:       ['回溯复习', 'bg-slate-300'],
                    };
                    const n = {};
                    this.wordList.forEach(w => { n[w.type] = (n[w.type] || 0) + 1; });
                    return Object.keys(meta)
                        .filter(k => n[k])
                        .map(k => ({ key: k, name: meta[k][0], dot: meta[k][1], count: n[k] }));
                },
                get selectedWords() { return this.wordList.filter(w => w.selected); },
                get selectedCount() { return this.selectedWords.length; },
                get wrongWordsList() { return this.selectedWords.filter(w => !w.isCorrect); },

                async init() {
                    const now = new Date();
                    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
                    this.currentDate = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${weekDays[now.getDay()]}`;
                    this.generateCalendar();

                    try {
                        const res = await fetch(`${this.API_BASE}/api/lessons`);
                        const data = await res.json();
                        this.lessons = data;
                        this.syncSelectedLesson();   // 课程可能在 setMode 之后才到，补一次校正
                    } catch (error) {
                        console.error("加载课程失败", error);
                    }
                },

                // 两种模式的课程互不相同：生字听写只列正式课，单元复习只列复习课。
                // 后端已给出 is_review，前端不必再猜 lesson_seq 的编码规则。
                get visibleLessons() {
                    const wantReview = this.dictationMode === 'unit';
                    return this.lessons.filter(l => !!l.is_review === wantReview);
                },

                // 切模式后下拉菜单的选项整批换了，selectedLesson 可能还指着上一模式的课。
                // 不校正的话会用正式课的 lesson_seq 配 mode=unit 去请求，出题梯队全错。
                syncSelectedLesson() {
                    const list = this.visibleLessons;
                    if (!list.length) { this.selectedLesson = null; return; }
                    if (!list.some(l => l.lesson_seq === this.selectedLesson)) {
                        this.selectedLesson = list[0].lesson_seq;
                    }
                },

                setMode(mode) {
                    this.dictationMode = mode;
                    this.syncSelectedLesson();
                    this.step = 1;
                },

                async generateWordList() {
                    this.step = 2; // 直接跳过假加载，等待后端真数据
                    try {
                        // 带有 mode 参数，供后端判断是生字配额还是纯复习包
                        const res = await fetch(`${this.API_BASE}/api/generate_daily/${this.selectedLesson}?mode=${this.dictationMode}`);
                        const data = await res.json();
                        
                        this.wordList = data.data.map(item => ({ 
                            kp_id: item.id, 
                            text: item.target,
                            pinyin: item.pinyin || "", 
                            type: item.word_type || 'review', // new_char, new_word, review, wrong
                            selected: true, 
                            isCorrect: true 
                        }));
                        
                    } catch(e) {
                        console.error("获取词表失败", e);
                        // Fallback Mock Data for UI testing
                        this.wordList = [
                            {kp_id: 1, text: "知识", pinyin: "zhī shi", type: "new_word", selected: true, isCorrect: true},
                            {kp_id: 2, text: "熊猫", pinyin: "xióng māo", type: "new_char", selected: true, isCorrect: true},
                            {kp_id: 3, text: "辛", pinyin: "xīn", type: "new_char", selected: true, isCorrect: true},
                            {kp_id: 4, text: "散步", pinyin: "sàn bù", type: "wrong", selected: true, isCorrect: true}
                        ];
                    }
                },

                async startAudioGeneration() {
                    if(this.selectedCount === 0) return;
                    
                    this.step = 3;
                    this.loadingProgress = 0;
                    
                    // 芝诺悖论渐进加载算法
                    let progressTimer = setInterval(() => {
                        let remaining = 95 - this.loadingProgress;
                        let step = Math.max(1, Math.floor(remaining * 0.05)); 
                        if (this.loadingProgress < 95) {
                            this.loadingProgress += step;
                        }
                    }, 400);

                    try {
                        const payload = this.selectedWords.map(w => ({ text: w.text, pinyin: w.pinyin }));
                        const res = await fetch(`${this.API_BASE}/api/generate_audio`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if(res.ok) {
                            const data = await res.json();
                            this.audioUrl = data.audio_url + "?t=" + Date.now(); 
                            this.timeline = data.timeline || [];
                            
                            clearInterval(progressTimer);
                            this.loadingProgress = 100;
                            
                            setTimeout(() => {
                                this.goToStep(4);
                                this.playerState = 'idle';
                            }, 400);
                        } else throw new Error("API failed");
                    } catch(e) {
                        clearInterval(progressTimer);
                        alert('语音生成失败，请确认后端服务运行正常');
                        this.goToStep(2);
                    }
                },

                syncTimeline(e) {
                    const currentTime = e.target.currentTime;
                    // 查找当前时间落在哪个词语的时间区间内
                    const currentWord = this.timeline.find(t => currentTime >= t.start && currentTime <= t.end);
                    this.currentTimelineWord = currentWord || null;
                },

                toggleRealPlay() {
                    const audio = this.$refs.audioPlayer;
                    if (!audio) return;
                    if (audio.paused) audio.play();
                    else audio.pause();
                },

                async calculateScore() {
                    // 提交每题对错，由后端算分并更新记忆库（含全对的情况，保证每天都留打卡记录）
                    const results = this.selectedWords.map(w => ({
                        kp_id: w.kp_id,
                        is_correct: w.isCorrect
                    }));
                    // 先用本地分数即时显示，避免等待网络
                    const total = results.length;
                    const correct = total - this.wrongWordsList.length;
                    this.score = total === 0 ? 0 : (correct / total) * 100;
                    this.mistakesSaved = false;
                    this.goToStep(6);

                    try {
                        const res = await fetch(`${this.API_BASE}/api/submit_dictation`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                user_id: 1,
                                dictation_type: this.dictationMode,
                                scope_id: this.selectedLesson,
                                results: results
                            })
                        });
                        if (!res.ok) throw new Error('API failed');
                        const data = await res.json();
                        this.score = data.score;   // 以服务端分数为准
                        this.mistakesSaved = true;
                    } catch (error) {
                        console.error("入库失败", error);
                        this.saveFailed = true;
                    }
                },

                // 六色体系：按注意力优先级分三组
                //   暖色警示  红=上次刚错  橙=近期错过
                //   冷色新知  蓝=本课生字  绿=本课词语
                //   低饱和    紫=易混填充  浅灰=回溯复习
                // 红色只给『上次刚错』，稀缺才有警示力。
                getCardClass(word) {
                    if (!word.selected) return 'bg-gray-50 opacity-50 grayscale border-transparent text-gray-400';
                    switch(word.type) {
                        case 'wrong_last':   return 'bg-red-50 border-red-400 text-red-700';
                        case 'wrong_recent': return 'bg-orange-50 border-orange-300 text-orange-700';
                        case 'new_char':     return 'bg-blue-50 border-blue-300 text-blue-800';
                        case 'new_word':     return 'bg-[#E9F9F0] border-[#07C160]/40 text-[#07C160]';
                        case 'filler':       return 'bg-purple-50 border-purple-200 text-purple-700';
                        case 'review':       return 'bg-slate-50 border-slate-200 text-slate-500';
                        default:             return 'bg-white border-gray-200';
                    }
                },
                getIconClass(type) {
                    switch(type) {
                        case 'wrong_last':   return 'text-red-500';
                        case 'wrong_recent': return 'text-orange-500';
                        case 'new_char':     return 'text-blue-500';
                        case 'new_word':     return 'text-[#07C160]';
                        case 'filler':       return 'text-purple-500';
                        case 'review':       return 'text-slate-400';
                        default:             return 'text-gray-400';
                    }
                },
                getScoreColorClass() {
                    if (this.score >= 90) return 'text-[#07C160]';
                    if (this.score >= 80) return 'text-[#91ED61]';
                    return 'text-[#EE5E5E]';
                },
                goToStep(s) { 
                    if (this.step === 4 && s !== 4 && this.$refs.audioPlayer) {
                        this.$refs.audioPlayer.pause();
                        this.playerState = 'paused';
                    }
                    this.step = s; 
                    document.querySelector('main').scrollTop = 0;
                },

                // 35天滚动视窗日历算法
                generateCalendar() {
                    const days = [];
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    const dayOfWeek = today.getDay(); 
                    const startDate = new Date(today);
                    startDate.setDate(today.getDate() - dayOfWeek - 14); // 回退到两周前的周日

                    for (let i = 0; i < 35; i++) {
                        const current = new Date(startDate);
                        current.setDate(startDate.getDate() + i);
                        const dateStr = `${current.getFullYear()}-${String(current.getMonth() + 1).padStart(2, '0')}-${String(current.getDate()).padStart(2, '0')}`;
                        
                        days.push({
                            date: current.getDate(),
                            fullDate: dateStr,
                            isToday: current.getTime() === today.getTime(),
                            isOtherMonth: current.getMonth() !== today.getMonth(),
                            score: null 
                        });
                    }
                    this.calendarDays = days;
                    this.fetchHistoryData();
                },

                async fetchHistoryData() {
                    try {
                        const start = this.calendarDays[0].fullDate;
                        const end = this.calendarDays[34].fullDate;
                        const res = await fetch(`${this.API_BASE}/api/dictation_history?start_date=${start}&end_date=${end}`);
                        const historyMap = await res.json();
                        
                        this.calendarDays.forEach(day => {
                            if(historyMap[day.fullDate] !== undefined) {
                                day.score = historyMap[day.fullDate];
                            }
                        });
                    } catch(e) { console.log("历史数据加载失败/未连接后端"); }
                },

                getCalColor(s) {
                    if (s === null) return 'bg-white text-gray-300 border border-gray-100';
                    if (s >= 90) return 'bg-[#07C160] text-white border border-[#07C160]';
                    if (s >= 80) return 'bg-[#91ED61] text-white border border-[#91ED61]';
                    return 'bg-[#EE5E5E] text-white border border-[#EE5E5E]';
                }
            }))
        })
    </script>
</body>
</html>
